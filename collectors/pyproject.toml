[project]
name = "volley-collectors"
version = "0.1.0"
description = "KOVO and news collectors that publish to Kafka (design.md 4.7)"
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.4",
  "confluent-kafka==2.10.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collectors*"]
