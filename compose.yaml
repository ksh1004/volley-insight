# 개발 환경 전체를 띄우는 Docker Compose 설정(설계서 1.5). 이 PC의 Docker Desktop 메모리가 약 16GB라
# 서비스를 '프로필'로 묶어 필요한 것만 띄울 수 있게 했다.
#   (프로필 없음)     기본: postgres, kafka, kafka-init           → 항상 뜬다
#   --profile app    웹: django-api, django-sse, frontend
#   --profile batch  배치: hadoop(hdfs + yarn), airflow, mlflow
#   --profile stream 스트림: hdfs + flink (+ live-collector)
#   --profile search 검색·모니터링: elasticsearch, kibana, filebeat, metricbeat (+ kibana-setup, 한 번만 실행)
# 예: docker compose --profile app up -d
# 모든 포트는 127.0.0.1(이 PC)에만 열린다(NFR-34: 외부에서 접속 불가).
# 비밀 값(비밀번호 등)은 .env 파일에서 ${이름}으로 읽는다(.env는 git에 올리지 않음, 예시는 .env.example).
# mem_limit: 서비스마다 메모리 상한(한 서비스가 PC 메모리를 다 쓰지 못하게).

# 하둡 서비스 4개(namenode, datanode, resourcemanager, nodemanager)가 함께 쓰는 설정 조각(YAML 앵커)
x-hadoop: &hadoop
  build: ./infra/hadoop
  image: volley/hadoop:3.4.1
  restart: unless-stopped

services:
  # ---------------- 기본(core) ----------------
  # 서비스 DB(웹·분석 결과), Airflow 메타 DB, MLflow DB를 한 PostgreSQL에 둔다(init-databases.sh가 처음에 만듦)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${SERVICE_DB}
      AIRFLOW_DB: ${AIRFLOW_DB}
      MLFLOW_DB: ${MLFLOW_DB}
      TZ: Asia/Seoul
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${SERVICE_DB}"]
      interval: 5s
      retries: 20
    mem_limit: 1g

  # KOVO 1초 1회 예산(NFR-01)은 KOVO를 부르는 모든 컨테이너(airflow, live-collector)가 함께 쓰는 잠금 파일이다.
  # 새 볼륨은 root 소유로 만들어지는데 airflow 이미지는 uid 50000으로 돌기 때문에, 한 번 소유자를 바꿔 주고 끝나는 컨테이너.
  kovo-rate-perms:
    image: volley/airflow:3.0.6
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 50000:0 /run/kovo && chmod 775 /run/kovo"]
    volumes:
      - kovo-rate:/run/kovo
    restart: "no"

  # 같은 이유: 새 볼륨은 root 소유인데 kafka 이미지는 appuser(uid 1000)로 돈다. 소유자를 바꾸고 끝난다.
  kafka-volume-perms:
    image: apache/kafka:3.9.0
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"

  # Kafka 브로커 하나(KRaft 모드: ZooKeeper 없이 브로커가 컨트롤러 역할도 함). 메시지는 7일(168시간) 보관.
  # 컨테이너끼리는 kafka:9092, PC에서는 localhost:29092로 접속한다. 토픽은 자동 생성하지 않는다(kafka-init이 만듦).
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    depends_on:
      kafka-volume-perms: { condition: service_completed_successfully }
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20
    mem_limit: 1g

  # 필요한 토픽을 만들고 끝나는 컨테이너(infra/kafka/create-topics.sh)
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  # ---------------- 웹(app) ----------------
  # REST API 서버(Django 개발 서버). backend 폴더를 그대로 연결해 코드를 고치면 바로 반영된다
  django-api:
    profiles: [app]
    build: ./backend
    image: volley/backend:dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 768m

  # SSE 게이트웨이(설계서 1.5): GET /api/live/{경기}/stream. Kafka live.metrics를 받아 브라우저로 밀어 준다.
  # django-api와 같은 코드지만 Uvicorn(ASGI)으로 띄워, 한 프로세스가 열린 스트림을 많이 붙들 수 있다.
  # 프론트엔드 개발 서버는 그 주소만 여기로 보낸다(vite.config.js).
  django-sse:
    profiles: [app]
    image: volley/backend:dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django-sse
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --timeout-graceful-shutdown 3
    volumes:
      - ./backend:/app
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 384m

  # Vue 개발 서버(Vite). node_modules는 별도 볼륨이라 Windows 폴더와 섞이지 않는다
  frontend:
    profiles: [app]
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://django-api:8000
      VITE_SSE_PROXY: http://django-sse:8001
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [django-api, django-sse]
    mem_limit: 768m

  # ---------------- 배치 / 스트림: 하둡 ----------------
  # HDFS(분산 파일 시스템): namenode = 파일 목록·위치 관리, datanode = 실제 데이터 저장
  # YARN(자원 관리): resourcemanager = 작업 배정, nodemanager = Spark executor가 실제로 도는 곳
  namenode:
    <<: *hadoop
    profiles: [batch, stream]
    hostname: namenode
    command: ["namenode"]
    volumes: ["hdfs-nn:/data/nn"]
    ports: ["127.0.0.1:9870:9870"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ >/dev/null"]
      interval: 10s
      retries: 30
    mem_limit: 768m

  datanode:
    <<: *hadoop
    profiles: [batch, stream]
    hostname: datanode
    command: ["datanode"]
    volumes: ["hdfs-dn:/data/dn"]
    depends_on:
      namenode: { condition: service_healthy }
    mem_limit: 768m

  resourcemanager:
    <<: *hadoop
    profiles: [batch]
    hostname: resourcemanager
    command: ["resourcemanager"]
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      namenode: { condition: service_healthy }
    mem_limit: 768m

  nodemanager:
    <<: *hadoop
    profiles: [batch]
    hostname: nodemanager
    command: ["nodemanager"]
    depends_on: [resourcemanager]
    mem_limit: 3500m

  # ---------------- 배치: airflow, mlflow ----------------
  # Airflow: DAG(작업 흐름) 일정 실행. standalone = 웹 화면 + 스케줄러 + 작업자를 한 컨테이너에서.
  # Spark 작업도 여기서 제출한다(드라이버가 이 컨테이너 안에서 돈다 → 메모리 4GB).
  airflow:
    profiles: [batch]
    build: ./infra/airflow
    image: volley/airflow:3.0.6
    hostname: airflow
    restart: unless-stopped
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # LocalExecutor는 병렬 슬롯마다 프로세스 하나를 띄워 둔다(기본 32개, 각 약 150MB). 우리 DAG는 동시에 몇 개면 된다.
      # 32개가 놀면서 4GB를 차지하자 Spark 드라이버가 쓸 메모리가 모자랐다(2026-11-05 정제 작업이 메모리 부족으로 강제 종료).
      AIRFLOW__CORE__PARALLELISM: "6"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW_CONN_SPARK_YARN: '{"conn_type": "spark", "host": "yarn", "extra": {"deploy-mode": "client"}}'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /opt/airflow/collectors
      # 어느 작업 프로세스(와 live-collector)의 KOVO 요청이든 하나의 1초 1회 예산을 함께 쓴다(NFR-01)
      KOVO_RATE_LOCK_FILE: /run/kovo/rate.lock
      WEBHDFS_URL: http://namenode:9870/webhdfs/v1
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # PIPE-09: 최종 실패한 작업은 job_alert에 저장되고, 이 값이 있으면 메신저 웹훅(Mattermost, Slack, Discord)으로도 보낸다.
      # 메시지에는 이 PC의 Airflow 작업 로그 링크가 들어간다.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      AIRFLOW_UI_URL: http://localhost:8080
      # 서비스 DB 접속 정보: Spark 작업(client 모드라 드라이버가 여기서 돎)이 정제·분석 결과를 적재할 때 쓴다
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DB: ${SERVICE_DB}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./collectors:/opt/airflow/collectors
      - ./infra/hadoop/conf:/opt/hadoop-conf:ro
      - airflow-logs:/opt/airflow/logs
      - kovo-rate:/run/kovo
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      kovo-rate-perms: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      resourcemanager: { condition: service_started }
    mem_limit: 4g

  # MLflow: 모델 학습 기록(실험·지표)과 모델 저장소(버전, champion 별칭). 학습 결과 파일은 볼륨에 저장
  mlflow:
    profiles: [batch]
    build: ./infra/mlflow
    image: volley/mlflow:3.1.1
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB}
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --host 0.0.0.0 --port 5000
    volumes: ["mlflow-artifacts:/mlflow/artifacts"]
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 768m

  # ---------------- 스트림: flink ----------------
  # Flink: Kafka 메시지를 실시간으로 처리(raw-archiver, article-enricher, live-metrics).
  # jobmanager = 작업 관리·화면(8081), taskmanager = 실제 처리. 하둡 설정을 함께 넣어 HDFS에 쓸 수 있게 이미지를 만든다.
  flink-jobmanager:
    profiles: [stream]
    build:
      context: ./infra/flink
      additional_contexts:
        hadoop: service:namenode
    image: volley/flink:1.20.1
    hostname: flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 2048m
        execution.checkpointing.interval: 30s
        state.checkpoints.dir: hdfs://namenode:9000/flink/checkpoints
      # article-enricher와 live-metrics는 서비스 DB에 쓴다(기사는 Elasticsearch에도)
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DB: ${SERVICE_DB}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./flink_jobs:/opt/flink/usrlib/jobs
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      namenode: { condition: service_healthy }
    mem_limit: 1200m

  flink-taskmanager:
    profiles: [stream]
    image: volley/flink:1.20.1
    restart: unless-stopped
    command: taskmanager
    environment: *flink-env
    volumes:
      - ./flink_jobs:/opt/flink/usrlib/jobs
    depends_on: [flink-jobmanager, datanode]
    mem_limit: 2300m

  # raw-archiver, article-enricher, live-metrics가 늘 제출돼 있게 지키는 컨테이너: PC나 Docker가 재시작되면 jobmanager가
  # 빈 상태로 뜨므로, 1분마다 확인해 없으면 가장 최근 체크포인트에서 다시 제출한다. 이미 돌고 있으면 두 번 제출하지 않는다.
  flink-job-keeper:
    profiles: [stream]
    image: volley/flink:1.20.1
    restart: unless-stopped
    command: >
      sh -c "while true; do
               sh /opt/flink/usrlib/jobs/submit.sh raw_archiver.py raw-archiver;
               sh /opt/flink/usrlib/jobs/submit.sh article_enricher.py article-enricher;
               sh /opt/flink/usrlib/jobs/submit.sh live_metrics.py live-metrics;
               sleep 60; done"
    environment:
      <<: *flink-env
      FLINK_JOBMANAGER: flink-jobmanager:8081
    volumes:
      - ./flink_jobs:/opt/flink/usrlib/jobs
    depends_on: [flink-jobmanager, flink-taskmanager]
    mem_limit: 512m

  # 오늘 경기를 따라간다: 15초마다 새 문자중계 이벤트 → kovo.live → Flink live-metrics (COL-06)
  # airflow 이미지(수집기 의존성이 들어 있음)를 그대로 써서 수집기 하나만 띄운다
  live-collector:
    profiles: [stream]
    image: volley/airflow:3.0.6
    restart: unless-stopped
    entrypoint: ["python", "-m", "collectors", "live", "--every", "15"]
    working_dir: /opt/airflow/collectors
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /opt/airflow/collectors
      KOVO_RATE_LOCK_FILE: /run/kovo/rate.lock
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DB: ${SERVICE_DB}
    volumes:
      - ./collectors:/opt/airflow/collectors:ro
      - kovo-rate:/run/kovo
    depends_on:
      kovo-rate-perms: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 256m

  # ---------------- 검색·모니터링(search) ----------------
  # Elasticsearch: 기사·팀·선수 검색 색인과 운영 로그·지표 저장(한국어 분석기 nori 플러그인을 넣은 이미지). 보안은 끔(이 PC 전용)
  elasticsearch:
    profiles: [search]
    build: ./infra/elasticsearch
    image: volley/elasticsearch:8.17.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      retries: 30
    mem_limit: 2g

  # Kibana: 운영 대시보드(수집 현황, Kafka 지연, 품질 문제 등)를 보는 화면(5601)
  kibana:
    profiles: [search]
    image: kibana:8.17.4
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 15s
      retries: 40
    mem_limit: 1g

  # Filebeat: 모든 컨테이너의 로그를 모아 Elasticsearch로 보낸다(infra/filebeat/filebeat.yml)
  filebeat:
    profiles: [search]
    image: elastic/filebeat:8.17.4
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./infra/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    mem_limit: 256m

  # Metricbeat: Kafka·PostgreSQL 지표와 DB 질의 결과(품질 문제 수 등)를 주기적으로 Elasticsearch로 보낸다
  metricbeat:
    profiles: [search]
    image: elastic/metricbeat:8.17.4
    restart: unless-stopped
    user: root
    command: ["metricbeat", "-e", "--strict.perms=false"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
      SERVICE_DB: ${SERVICE_DB}
    volumes:
      - ./infra/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    mem_limit: 256m

  # 모든 Kafka 컨슈머 그룹의 지연 → Elasticsearch metrics-volley, 30초마다(collectors/kafka_lag.py)
  kafka-lag:
    profiles: [search]
    image: volley/airflow:3.0.6
    restart: unless-stopped
    entrypoint: ["python", "-m", "collectors", "kafka-lag", "--every", "30"]
    working_dir: /opt/airflow/collectors
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PYTHONPATH: /opt/airflow/collectors
    volumes:
      - ./collectors:/opt/airflow/collectors:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 256m

  # Kibana 데이터 뷰와 운영 대시보드(infra/kibana/dashboard.ndjson)를 넣고 끝나는 컨테이너
  kibana-setup:
    profiles: [search]
    image: curlimages/curl:8.11.1
    restart: "no"
    entrypoint: ["sh", "/setup/setup.sh"]
    volumes:
      - ./infra/kibana:/setup:ro
    depends_on:
      kibana: { condition: service_healthy }

# 데이터를 보관하는 Docker 볼륨들(컨테이너를 지워도 남는다)
volumes:
  pg-data:
  kafka-data:
  hdfs-nn:
  hdfs-dn:
  airflow-logs:
  mlflow-artifacts:
  es-data:
  kovo-rate:
  frontend-node-modules:
